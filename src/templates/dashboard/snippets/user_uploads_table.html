<tr class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
    <th scope="row" class="text-left px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white">
        {{ object.file.name }}
    </th>
    <td class="px-6 py-4">
        {{ object.uploaded_at|timesince }}
    </td>
    <td class="px-6 py-4 text-right">
        <a href="{{ object.deleteion_url }}" class="font-medium text-blue-600 dark:text-blue-500 hover:underline">Delete</a>
    </td>
</tr>
