{% extends 'dashboard/base.html' %}

{% block head_title %}Homepage - {{ block.super }}{% endblock head_title %}

{% block content %}

<div
class="border-gray-300 dark:border-gray-600 h-96 mb-4"
>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white" for="id_file">Upload your CV</label>
            <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white" for="id_file">(PDF only)</label>
            <input type="file" name="file" required id="id_file" class="block w-full mb-5 text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 dark:text-gray-400 focus:outline-none dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400">
        </div>
        <div class="mt-5">
            <button type="submit" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">Upload file</button> 
        </div>
    </form>
</div>

{% endblock content %}
